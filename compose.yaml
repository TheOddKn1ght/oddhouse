name: oddhouse
services:
  app:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-http://localhost:8091}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PATH: ${DATABASE_PATH:-/data/oddhouse.sqlite}
      ORIGIN: ${ORIGIN:-http://localhost:8091}
    volumes:
      - oddhouse-data:/data
      - oddhouse-backups:/backups
    ports:
      - '127.0.0.1:${APP_PORT:-8091}:3000'
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
  backup:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-http://localhost:8091}
    profiles: ['backup']
    restart: unless-stopped
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/oddhouse.sqlite}
      BACKUP_DIRECTORY: /backups
    volumes:
      - oddhouse-data:/data
      - oddhouse-backups:/backups
    command: ['bun', 'scripts/backup.ts', 'watch']
    healthcheck:
      disable: true # This utility process does not run the app HTTP server.
    depends_on:
      app:
        condition: service_healthy
    init: true
volumes:
  oddhouse-data:
  oddhouse-backups:
