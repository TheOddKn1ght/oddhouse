# Managed by oddhouse
log_format oddhouse_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=oddhouse_collect:10m rate=10r/s;
server {
    listen 80;
    __IPV6_HTTP__
    server_name __DOMAIN__;
    server_tokens off;
    access_log /var/log/nginx/oddhouse.access.log oddhouse_safe;
    error_log /var/log/nginx/oddhouse.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/oddhouse/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    __IPV6_HTTPS__
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/oddhouse/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddhouse/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:oddhouseTLS:10m;
    server_tokens off;
    access_log /var/log/nginx/oddhouse.access.log oddhouse_safe;
    error_log /var/log/nginx/oddhouse.error.log;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /api/collect {
        limit_req zone=oddhouse_collect burst=50 nodelay;
        limit_req_status 429;
        access_log off;
        if (-f /var/lib/oddhouse/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        open_file_cache off;
        if (-f /var/lib/oddhouse/maintenance) { return 503 "oddhouse-maintenance\n"; }
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
    }
}
